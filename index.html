<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f9f7f1">
    <meta name="description" content="WearMate 2D 穿搭工作台，在同一个形象上自由试搭。">
    <title>穿搭工作台 · WearMate</title>
    <link rel="icon" type="image/svg+xml" href="./assets/mark.svg">
    <link rel="stylesheet" href="./src/theme.css">
    <link rel="stylesheet" href="./src/studio.css">
    <link rel="stylesheet" href="./src/today/today.css">
    <script type="module" src="./src/workbench.mjs"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="container masthead-inner">
        <a class="brand" href="./" aria-label="WearMate 工作台首页">
          <img src="./assets/mark.svg" width="32" height="32" alt="">
          <span>WearMate<span class="brand-period">.</span></span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a class="site-link" href="./create.html">创建分身</a>
          <a class="current-section" href="./" aria-current="page">穿搭工作台</a>
          <a class="site-link" href="./wardrobe.html">我的衣橱</a>
        </nav>
      </div>
    </header>

    <main class="container studio">
      <div class="intro">
        <div>
          <p class="eyebrow intro-label">2D FITTING STUDIO</p>
          <h1>穿搭工作台</h1>
        </div>
        <a id="today-entry" href="./?view=today" hidden>今日穿搭 <span aria-hidden="true">↗</span></a>
        <p class="intro-note">从一套造型开始，<br class="desktop-break">换一件单品，试出自己的搭配。</p>
      </div>

      <p id="rebuild-status" class="asset-error" role="status" hidden></p>
      <section id="weather-panel" aria-label="今日天气" hidden>
        <div class="weather-controls">
          <label>城市<select id="weather-city"></select></label>
          <label>天气来源<select id="weather-mode"><option value="live">实时预报</option></select></label>
          <button id="weather-retry" type="button">重新获取</button>
        </div>
        <p id="weather-status" role="status"></p>
        <div id="weather-summary" hidden>
          <strong id="weather-degree"></strong>
          <div><strong id="weather-condition"></strong><p id="weather-range"></p></div>
          <div class="weather-detail"><p id="weather-hint"></p><p id="weather-values"></p><p id="weather-source"></p></div>
        </div>
      </section>
      <div class="studio-grid">
        <figure class="look" id="fitting-room" tabindex="-1">
          <div class="stage">
            <div class="stage-frame" aria-hidden="true"></div>
            <div class="stage-light" aria-hidden="true"></div>
            <div class="floor-shadow" aria-hidden="true"></div>
            <div id="avatar" class="avatar" role="img" aria-label="示例角色 Mila"></div>
            <div class="stage-label"><strong id="stage-role-name">Mila</strong><span id="stage-role-type">示例模特</span></div>
          </div>
          <figcaption class="look-caption">
            <div class="current-look" aria-live="polite" aria-atomic="true">
              <div class="caption-title"><span class="status-dot" aria-hidden="true"></span><span class="caption-label">当前造型</span><strong id="look-name">舒适休闲</strong></div>
              <span id="look-details" class="look-details"></span>
            </div>
            <a class="mobile-jump" href="#wardrobe">选单品</a>
          </figcaption>
        </figure>

        <section id="rebuild-panel" hidden aria-labelledby="rebuild-title">
          <h2 id="rebuild-title">短发女士 · 重绘母版</h2>
          <p>正面站姿 · 默认造型</p>
          <a href="./?view=fitting">打开原换装工作台 ↗</a>
        </section>
        <aside class="controls" aria-label="穿搭选择">
          <section id="today-recommendations" hidden aria-label="今日推荐">
            <div class="section-heading"><h2>推荐穿搭</h2><a class="adjust-link" href="./?view=fitting">手动调整 ↗</a></div>
            <div id="weather-plans"></div><div id="weather-notes" role="status"></div>
            <p id="plan-feedback" role="status"></p>
          </section>
          <section class="control-section" aria-labelledby="outfits-title">
            <div class="section-heading">
              <h2 id="outfits-title">预设搭配</h2>
            </div>
            <div id="outfits" class="outfit-list" aria-label="一键切换全套服装"></div>
          </section>

          <section class="control-section wardrobe" id="wardrobe" aria-labelledby="wardrobe-title" tabindex="-1">
            <div class="section-heading">
              <h2 id="wardrobe-title">精选单品</h2>
              <a class="mobile-jump" href="#fitting-room">查看试穿效果</a>
            </div>
            <div id="categories" class="categories" role="tablist" aria-label="服装分类"></div>
            <p id="tryon-feedback" class="tryon-feedback" role="status" hidden></p>
            <div id="garments" class="garment-list" role="tabpanel" tabindex="0"></div>
            <p id="asset-error" class="asset-error" role="status" hidden></p>
          </section>

          <section class="control-section save-look" aria-labelledby="save-look-title">
            <div class="section-heading"><h2 id="save-look-title">保存穿搭</h2></div>
            <form id="save-look-form">
              <label for="look-title">穿搭名称</label>
              <div class="save-look-row">
                <input id="look-title" name="name" type="text" maxlength="45" placeholder="例如 周末出门" required>
                <button type="submit" id="save-look-button" disabled>保存</button>
              </div>
            </form>
            <p id="saved-look-status" class="tryon-feedback" role="status" hidden></p>
            <details id="saved-looks" hidden>
              <summary>已保存的穿搭</summary>
              <ul id="saved-look-list"></ul>
            </details>
          </section>
        </aside>
      </div>
    </main>
  </body>
</html>
