<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f9f7f1">
    <meta name="description" content="在同一个真实 GLB 人物上切换独立三维服装网格，旋转检查 3D 试穿效果。">
    <title>3D 衣橱 · WearMate</title>
    <link rel="icon" type="image/svg+xml" href="./assets/mark.svg">
    <link rel="stylesheet" href="./src/theme.css">
    <link rel="stylesheet" href="./src/studio.css">
    <link rel="stylesheet" href="./src/3d/viewer.css">
    <link rel="stylesheet" href="./src/wardrobe/wardrobe.css">
    <script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
    <script type="module" src="./src/wardrobe/tryon3d.mjs"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="container masthead-inner">
        <a class="brand" href="./" aria-label="WearMate 工作台首页">
          <img src="./assets/mark.svg" width="32" height="32" alt="">
          <span>WearMate<span class="brand-period">.</span></span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a class="site-link" href="./create.html">创建 3D 分身</a>
          <a class="site-link" href="./">3D 工作台</a>
          <a class="current-section" href="./wardrobe.html" aria-current="page">3D 衣橱</a>
        </nav>
      </div>
    </header>

    <main class="container studio">
      <div class="intro">
        <div>
          <p class="eyebrow intro-label">TRUE 3D WARDROBE</p>
          <h1>3D 服装试穿</h1>
        </div>
        <p class="intro-note">服装是独立三维网格，<br class="desktop-break">可与人物一起旋转、缩放和检查。</p>
      </div>

      <div class="tryon-grid">
        <figure class="look">
          <div class="stage">
            <div class="stage-frame" aria-hidden="true"></div>
            <div class="stage-light" aria-hidden="true"></div>
            <div id="tryon-viewer" class="model-viewport"></div>
            <span id="tryon-empty" class="model-empty">正在读取 3D 人物…</span>
            <div class="stage-label"><strong>3D Try-on</strong><span>同一人物 · 独立服装网格</span></div>
          </div>
          <figcaption class="look-caption">
            <div class="current-look" aria-live="polite" aria-atomic="true">
              <div class="caption-title"><span class="status-dot" aria-hidden="true"></span><span class="caption-label">试穿状态</span><strong id="tryon-state">等待人物</strong></div>
              <span id="tryon-summary" class="look-details">尚未选择服装</span>
            </div>
          </figcaption>
        </figure>

        <aside class="controls" aria-label="3D 服装选择">
          <section class="control-section">
            <div class="section-heading"><h2>模型操作</h2></div>
            <div class="model-toolbar workbench-toolbar">
              <a class="primary-model-action" href="./create.html">创建 / 更换 3D 分身</a>
              <button id="tryon-reset" type="button" disabled>重置视角</button>
              <button id="tryon-rotate" type="button" aria-pressed="false" disabled>自动旋转</button>
            </div>
            <p id="tryon-status" class="model-meta" role="status">正在加载人物与服装目录…</p>
            <p id="tryon-error" class="asset-error" role="alert" hidden></p>
          </section>

          <section class="control-section">
            <div class="section-heading"><h2>选择 3D 服装</h2></div>
            <div id="garment-groups" class="garment-groups"></div>
            <button id="remove-all" class="remove-all" type="button" disabled>脱下全部服装</button>
          </section>

          <section class="control-section">
            <div class="section-heading"><h2>适配说明</h2></div>
            <p class="model-meta">本地人台与衣服共用身高、肩宽和躯干截面参数，随体型一同变形。此处展示静态搭配，真实尺码与松量还取决于成衣尺寸和面料。</p>
            <p class="model-meta">服装来源：CharacterCreator / MakeHuman CC0 素材。试衣在当前浏览器完成。</p>
          </section>
        </aside>
      </div>
    </main>
  </body>
</html>
